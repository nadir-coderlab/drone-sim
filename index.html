<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>محاكي الدرون</title>
<meta name="description" content="محاكي درون بالعربي: كورس طيران خطوة بخطوة (DJI Mini و FPV)، طوارئ، اختبار نظري — يشتغل بالكمبيوتر والجوال والتلفزيون">
<meta name="theme-color" content="#0b1118">
<meta name="color-scheme" content="dark">
<meta name="format-detection" content="telephone=no">
<!-- الموقع كتطبيق (PWA): التثبيت على الجوال + يشتغل بدون نت (sw.js) -->
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="محاكي الدرون">
<style>
  :root {
    --bg: #0b1118; --panel: rgba(13, 20, 30, 0.86); --panel2: #121c28; --line: #263445; --text: #eef3f8; --muted: #9db0c3;
    --acc: #38bdf8; --ok: #22c55e; --warn: #f59e0b; --bad: #ef4444; --gold: #facc15;
    /* --sx/--sy = هوامش الشاشة الآمنة (التلفزيون 5%)، --hs = تكبير الشاشة فوق المحاكي، --uz = تكبير القوائم */
    --sx: 0px; --sy: 0px; --hs: 1; --uz: 1;
    --mono: Consolas, "Lucida Console", "Courier New", monospace;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: var(--bg); color: var(--text); font-family: "Segoe UI", Tahoma, Arial, sans-serif; }
  canvas#c { position: fixed; inset: 0; width: 100vw; height: 100vh; display: block; }
  .hidden { display: none !important; }
  small { font-size: 0.78em; color: var(--muted); }
  .ok { color: var(--ok); } .warn { color: var(--warn); } .bad { color: var(--bad); } .dim { opacity: .35; }
  .blink { animation: blink 0.8s steps(2) infinite; } @keyframes blink { 50% { opacity: .25; } }

  /* ---------- الشاشة فوق المحاكي (HUD) ---------- */
  #hud { position: fixed; inset: 0; pointer-events: none; font-size: 15px; }
  #hud canvas { display: block; }

  /* لوحة المهمة + التحذيرات (يمين) */
  #rightCol { position: absolute; top: calc(var(--sy) + 10px + 44px * var(--hs)); right: calc(var(--sx) + 12px); width: min(420px, 38vw); display: flex; flex-direction: column; gap: 8px; align-items: stretch; transform: scale(var(--hs)); transform-origin: top right; }
  #taskPanel { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 10px 14px; }
  #tpMission { font-size: 14px; color: var(--muted); }
  #tpTask { font-size: 18px; font-weight: 700; margin: 3px 0; }
  #tpHint { font-size: 19px; font-weight: 700; color: #fef08a; line-height: 1.5; min-height: 28px; }
  .bar { height: 7px; background: #1e293b; border-radius: 4px; overflow: hidden; margin: 8px 0 4px; } #tpBar { display: block; height: 100%; width: 0; background: linear-gradient(90deg, var(--acc), var(--ok)); transition: width .2s; }
  #tpMeta { font-size: 13px; color: var(--muted); }
  #tpSim { font-size: 13px; color: var(--muted); margin-top: 4px; display: flex; flex-wrap: wrap; gap: 4px 12px; }
  #warnBox { display: flex; flex-direction: column; gap: 6px; align-items: flex-end; }
  .w { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 6px 12px; font-weight: 700; }
  .w.bad { border-color: #7f1d1d; color: #fecaca; background: rgba(69, 10, 10, .85); } .w.warn { border-color: #78350f; color: #fde68a; }

  /* ---- DJI Fly OSD (درون التصوير) ---- */
  .osd { position: absolute; inset: 0; display: none; }
  #hud.osd-dji #dji, #hud.osd-bf #bf { display: block; }
  #djiBat { position: absolute; top: var(--sy); left: var(--sx); right: var(--sx); height: 5px; background: rgba(255, 255, 255, .16); direction: ltr; }
  #djiBatCrit { position: absolute; left: 0; top: 0; bottom: 0; width: 0; background: rgba(239, 68, 68, .5); }
  #djiBatFill { position: absolute; left: 0; top: 0; bottom: 0; width: 100%; background: #22c55e; transition: width .4s, background-color .4s; }
  #djiBatFill.mid { background: #facc15; } #djiBatFill.low { background: #ef4444; }
  #djiBatH { position: absolute; top: 5px; left: 20%; transform: translateX(-50%) scale(var(--hs)); transform-origin: top center; font: 800 11px/1 Arial, sans-serif; color: #111; background: #fde047; border-radius: 3px; padding: 2px 4px; transition: left .5s; }
  #djiBatH::before { content: ''; position: absolute; left: 50%; top: -5px; height: 5px; border-left: 2px solid #fde047; margin-left: -1px; }
  #djiTop { position: absolute; top: calc(var(--sy) + 5px); left: var(--sx); right: var(--sx); height: calc(44px * var(--hs)); display: flex; align-items: center; justify-content: space-between; padding: 0 calc(14px * var(--hs)); background: linear-gradient(rgba(0, 0, 0, .62), rgba(0, 0, 0, 0)); direction: ltr; font-size: calc(15px * var(--hs)); font-weight: 600; text-shadow: 0 1px 2px rgba(0, 0, 0, .9); white-space: nowrap; font-variant-numeric: tabular-nums; }
  .dl, .dr { display: flex; align-items: center; gap: calc(14px * var(--hs)); }
  .djiMode { font-size: 1.45em; font-weight: 800; min-width: 1.3em; text-align: center; letter-spacing: .02em; }
  .djiMode.mA { color: #fde047; } .djiMode.mS { color: #fca5a5; } .djiMode.mC { color: #a5f3fc; }
  .djiStat { padding: .2em .75em; border-radius: .45em; font-size: .9em; direction: rtl; text-shadow: none; }
  .djiStat.s-ok { background: rgba(22, 163, 74, .88); color: #fff; } .djiStat.s-warn { background: rgba(234, 179, 8, .92); color: #1a1300; } .djiStat.s-bad { background: rgba(220, 38, 38, .92); color: #fff; }
  .di { display: inline-flex; align-items: center; gap: .3em; } .di svg { width: 1.2em; height: 1.2em; fill: currentColor; }
  .di.off { color: rgba(255, 255, 255, .38); } .di.red { color: #f87171; } .di.yel { color: #fde047; }
  .di small { color: #e2e8f0; font-size: .78em; }
  .sigb { display: inline-flex; align-items: flex-end; gap: 1px; height: 1em; }
  .sigb i { width: .22em; background: rgba(255, 255, 255, .28); } .sigb i:nth-child(1) { height: 25%; } .sigb i:nth-child(2) { height: 45%; } .sigb i:nth-child(3) { height: 62%; } .sigb i:nth-child(4) { height: 80%; } .sigb i:nth-child(5) { height: 100%; }
  .sigb.b1 i:nth-child(-n+1), .sigb.b2 i:nth-child(-n+2), .sigb.b3 i:nth-child(-n+3), .sigb.b4 i:nth-child(-n+4), .sigb.b5 i { background: #fff; }
  .sigb.weak i:nth-child(-n+2) { background: #f87171; }
  .batIco { display: inline-block; width: 1.5em; height: .8em; border: 2px solid currentColor; border-radius: 3px; position: relative; padding: 1px; }
  .batIco::after { content: ''; position: absolute; right: -4px; top: 25%; height: 50%; border-right: 2px solid currentColor; }
  .batIco i { display: block; height: 100%; width: 100%; background: currentColor; border-radius: 1px; }
  #djiTel { position: absolute; left: calc(var(--sx) + 16px); bottom: calc(var(--sy) + 16px); display: flex; align-items: center; gap: 10px; direction: ltr; transform: scale(var(--hs)); transform-origin: bottom left; text-shadow: 0 1px 3px #000, 0 0 2px #000; font-variant-numeric: tabular-nums; }
  #att { width: 84px; height: 84px; }
  .tnum { display: grid; grid-template-columns: auto auto; gap: 2px 18px; }
  .tnum div { font-size: 22px; font-weight: 700; white-space: nowrap; } .tnum b { font-size: 13px; color: #cbd5e1; margin-right: 5px; } .tnum small { font-size: 12px; color: #e2e8f0; margin-left: 2px; }
  .tnum em { display: block; font-style: normal; font-size: 13px; font-weight: 600; color: #e2e8f0; }

  /* ---- Betaflight OSD (درون FPV) ---- */
  .bfont { font-family: var(--mono); font-weight: 700; color: #fff; text-shadow: -1px -1px 0 #000, 1px -1px 0 #000, -1px 1px 0 #000, 1px 1px 0 #000, 0 0 3px #000; direction: ltr; letter-spacing: .04em; font-size: calc(clamp(13px, 2.3vh, 26px) * var(--hs)); }
  .bfi { position: absolute; white-space: pre; line-height: 1.25; }
  .bfFull { display: none; } #hud.cam .bfFull { display: block; } #hud.cam #bfBar { display: none; }
  #bfBar { position: absolute; top: calc(var(--sy) + 10px); left: 46%; transform: translateX(-50%); padding: 3px 12px; border-radius: 8px; background: rgba(0, 0, 0, .32); white-space: pre; }
  #bfTL { top: calc(var(--sy) + 14px); left: calc(var(--sx) + 18px); }
  #bfTC { top: calc(var(--sy) + 14px); left: 46%; transform: translateX(-50%); text-align: center; }
  #bfWarn { top: 27%; left: 50%; transform: translateX(-50%); text-align: center; font-size: 1.15em; }
  #bfL { left: calc(var(--sx) + 18px); bottom: 300px; }
  #bfR { right: calc(var(--sx) + 18px); bottom: 300px; text-align: right; }
  #bfHome { top: 57%; left: 50%; transform: translateX(-50%); text-align: center; }
  body.tv #bfHome { top: 41%; }   /* التلفزيون (960×540): فوق المؤشر، بعيد عن فقاعة المدرب */
  #bfArrow { display: inline-block; transition: transform .1s linear; }

  /* لوحة الرسم بالنص: المؤشر والأفق والرادار والهدف */
  #osdC { position: absolute; left: 18vw; top: 14vh; width: 64vw; height: 72vh; display: none; }

  /* العصي (مع ظل الحركة المطلوبة) */
  #sticksBox { position: absolute; bottom: calc(var(--sy) + 12px); left: 50%; transform: translateX(-50%) scale(var(--hs)); transform-origin: bottom center; display: flex; flex-direction: column; align-items: center; gap: 4px; }
  #sticksBox .sr { display: flex; gap: 26px; direction: ltr; }
  #sticksBox figure { margin: 0; text-align: center; font-size: 12px; font-weight: 600; color: #e2e8f0; text-shadow: 0 1px 2px #000, 0 0 4px #000; }
  #stL, #stR { width: 104px; height: 104px; }
  #stickTxt { font-size: 16px; font-weight: 700; color: #fde68a; background: rgba(10, 16, 24, .72); border: 1px solid #78350f; border-radius: 10px; padding: 4px 12px; max-width: 520px; text-align: center; }
  #stickTxt:empty { display: none; }

  /* المدرب */
  #coach { position: absolute; left: 50%; bottom: calc(var(--sy) + 26px); transform: translateX(-50%) translateY(10px) scale(var(--hs)); transform-origin: bottom center; width: max-content; max-width: min(640px, 64vw); background: rgba(10, 18, 30, .92); border: 1px solid #0b6b9b; border-right: 5px solid var(--acc); border-radius: 14px; padding: 8px 16px 10px; opacity: 0; transition: opacity .35s, transform .35s; box-shadow: 0 8px 30px rgba(0, 0, 0, .45); }
  #hud.sticks-on #coach { bottom: calc(var(--sy) + 12px + 172px * var(--hs)); }
  #hud.sticks-on.stick-txt #coach { bottom: calc(var(--sy) + 12px + 206px * var(--hs)); }
  #coach.show { opacity: 1; transform: translateX(-50%) translateY(0) scale(var(--hs)); }
  #coach .who { font-size: 13px; color: #7dd3fc; font-weight: 700; margin-bottom: 2px; }
  #coachTxt { font-size: 19px; font-weight: 700; line-height: 1.55; }
  #coach.k-good { border-color: #14532d; border-right-color: var(--ok); } #coach.k-good .who { color: #86efac; }
  #coach.k-warn { border-color: #78350f; border-right-color: var(--warn); } #coach.k-warn .who { color: #fcd34d; }
  #coach.k-bad { border-color: #7f1d1d; border-right-color: var(--bad); } #coach.k-bad .who { color: #fca5a5; }

  /* الخريطة الصغيرة */
  #mini { position: absolute; bottom: calc(var(--sy) + 14px); right: calc(var(--sx) + 14px); width: 190px; height: 190px; border-radius: 50%; border: 2px solid var(--line); transform: scale(var(--hs)); transform-origin: bottom right; }

  /* الشاشة الصغيرة + الهدف فيها */
  #pipFrame { position: absolute; border: 2px solid rgba(255, 255, 255, .55); border-radius: 6px; }
  #pipLabel { position: absolute; top: -24px; right: 0; background: var(--panel); padding: 1px 8px; border-radius: 6px; font-size: 12px; white-space: nowrap; }
  #pipRet { position: absolute; left: 50%; top: 50%; width: 24px; height: 24px; margin: -12px 0 0 -12px; border: 2px solid rgba(255, 255, 255, .9); border-radius: 50%; box-shadow: 0 0 0 1px rgba(0, 0, 0, .6); display: none; }
  #pipRet.on { display: block; } #pipRet.in { border-color: #4ade80; }

  /* دائرة المساعدة حول الدرون */
  #marker { position: absolute; left: 0; top: 0; width: 44px; height: 44px; border: 2px solid rgba(250, 204, 21, .9); border-radius: 50%; }
  #marker span { position: absolute; top: 46px; left: 50%; transform: translateX(-50%); font-size: 12px; font-weight: 700; color: #fde68a; text-shadow: 0 1px 2px #000; white-space: nowrap; }

  /* الزوم */
  #zoomInd { position: absolute; right: calc(var(--sx) + 18px); top: 50%; transform: translateY(-50%) scale(var(--hs)); transform-origin: center right; display: none; flex-direction: column; align-items: center; gap: 6px; direction: ltr; text-shadow: 0 1px 2px #000; }
  #zoomInd.on { display: flex; }
  /* التلفزيون: لوحة المهمة توصل لنص الشاشة — الزوم ينزل جنب الخريطة الصغيرة */
  body.tv #zoomInd { top: auto; bottom: calc(var(--sy) + 14px); right: calc(var(--sx) + 26px + var(--miniW, 190px) * var(--hs)); transform: scale(var(--hs)); transform-origin: bottom right; }
  #zoomVal { font-size: 18px; font-weight: 800; background: rgba(0, 0, 0, .45); border-radius: 999px; padding: 4px 10px; }
  #zoomInd i { width: 6px; height: 120px; border-radius: 3px; background: rgba(255, 255, 255, .25); position: relative; overflow: hidden; }
  #zoomFill { position: absolute; left: 0; right: 0; bottom: 0; height: 0; background: #fde047; }

  /* القياسات الفنية (زر VIEW) */
  #telemO { position: absolute; top: calc(var(--sy) + 100px); left: calc(var(--sx) + 12px); margin: 0; padding: 8px 12px; background: rgba(0, 0, 0, .62); border: 1px solid #334155; border-radius: 10px; font: 600 12px/1.45 var(--mono); color: #e2e8f0; direction: ltr; text-align: left; white-space: pre; transform: scale(var(--hs)); transform-origin: top left; }

  /* رسائل */
  #toasts { position: fixed; top: calc(var(--sy) + 56px); left: 46%; transform: translateX(-50%); display: flex; flex-direction: column; gap: 6px; align-items: center; width: min(520px, 44vw); z-index: 20; pointer-events: none; }
  .toast { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 7px 14px; font-weight: 700; transition: opacity .6s; text-align: center; transform: scale(var(--hs)); }
  .toast.good { border-color: #14532d; color: #bbf7d0; } .toast.bad { border-color: #7f1d1d; color: #fecaca; } .toast.task { border-color: #075985; color: #bae6fd; font-size: 17px; }
  .toast.fade { opacity: 0; }
  #bigmsg { position: absolute; top: 38%; left: 50%; transform: translate(-50%, -50%) scale(calc(.9 * var(--hs))); font-size: 34px; font-weight: 800; background: var(--panel); padding: 16px 28px; border-radius: 16px; opacity: 0; transition: all .3s; text-align: center; }
  #bigmsg.show { opacity: 1; transform: translate(-50%, -50%) scale(var(--hs)); } #bigmsg.bad { color: #fecaca; border: 2px solid var(--bad); }
  #demoTag { position: absolute; top: 38%; left: calc(var(--sx) + 14px); background: #4c1d95; padding: 6px 12px; border-radius: 10px; font-weight: 700; transform: scale(var(--hs)); transform-origin: top left; }
  #flash { position: absolute; inset: 0; background: #fff; opacity: 0; }
  #flash.go { animation: shot .35s ease-out; } @keyframes shot { 0% { opacity: .75; } 100% { opacity: 0; } }

  /* ---------- القوائم ---------- */
  .ui { position: fixed; inset: 0; overflow-y: auto; z-index: 10; }
  .ui.full { background: linear-gradient(180deg, rgba(8, 13, 20, .78), rgba(8, 13, 20, .93)); backdrop-filter: blur(3px); }
  .ui.overlay { display: flex; align-items: center; justify-content: center; background: rgba(0, 0, 0, .45); }
  .screen { max-width: 1100px; margin: 0 auto; padding: 28px 22px 40px; }
  .ui.overlay .screen { background: var(--panel2); border: 1px solid var(--line); border-radius: 18px; padding: 22px 26px; width: min(760px, 94vw); max-height: 92vh; overflow-y: auto; box-shadow: 0 20px 60px rgba(0,0,0,.5); }
  .screen.title { text-align: center; padding-top: 12vh; }
  .logo { font-size: 72px; } h1 { font-size: 46px; margin: 6px 0; } .lead { font-size: 20px; color: var(--muted); }
  .head h2 { margin: 0 0 4px; font-size: 30px; } .head p { margin: 0 0 16px; color: var(--muted); font-size: 16px; }
  h3 { margin: 20px 0 8px; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 12px; }
  .grid.g4 { grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); } .grid.g3 { grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); }
  .btn { font: inherit; color: var(--text); background: #182433; border: 1px solid var(--line); border-radius: 12px; padding: 10px 16px; cursor: pointer; font-size: 17px; transition: transform .08s, background .15s; text-align: center; }
  .btn:hover { background: #1f2f43; }
  .btn.focus { outline: 3px solid var(--acc); outline-offset: 2px; background: #1f3550; transform: scale(1.02); }
  .btn[disabled] { opacity: .4; cursor: default; }
  .btn.big { font-size: 21px; padding: 13px 26px; background: #0e4f72; border-color: #0b6b9b; font-weight: 700; }
  .btn.ok { background: #14532d; } .btn.bad { background: #5b1414; } .btn.submit { background: #7c2d12; border-color: #9a3412; }
  .card { display: flex; flex-direction: column; align-items: flex-start; gap: 4px; text-align: right; padding: 14px 16px; min-height: 108px; position: relative; }
  .card .ic { font-size: 30px; } .card .tt { font-size: 19px; font-weight: 700; } .card .ds { font-size: 14px; color: var(--muted); line-height: 1.5; }
  .card.hl { border-color: #0b6b9b; background: linear-gradient(135deg, #0c3550, #182433); } .card.off { opacity: .45; }
  .badge { position: absolute; top: 10px; left: 12px; font-size: 13px; background: #0f172a; border: 1px solid var(--line); padding: 2px 8px; border-radius: 999px; }
  .dots { position: absolute; top: 12px; left: 12px; letter-spacing: 3px; font-style: normal; } .dots i { font-style: normal; }
  .row { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 18px; align-items: center; }
  .col { display: flex; flex-direction: column; gap: 10px; }
  .opts { display: flex; flex-direction: column; gap: 10px; } .opt b { margin-left: 6px; }
  .opts .opt { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; } .opts .opt > b { min-width: 230px; }
  .chip { font-size: 15px; padding: 7px 13px; } .chip.on { background: #0e4f72; border-color: var(--acc); }
  .desc { font-size: 18px; line-height: 1.7; } .rules { font-size: 17px; line-height: 1.9; }
  .tipbox { background: #0f1b28; border: 1px solid var(--line); border-radius: 12px; padding: 12px 16px; margin-top: 14px; line-height: 1.8; font-size: 15px; }
  .tipbox.warnbox { border-color: #78350f; background: #2a1a08; }
  .tbl { width: 100%; border-collapse: collapse; margin-top: 10px; } .tbl td, .tbl th { border-bottom: 1px solid var(--line); padding: 8px; text-align: right; } .tbl th { color: var(--muted); font-weight: 600; }
  .res { font-size: 28px; font-weight: 800; margin: 10px 0; } .res.ok { color: var(--ok); } .res.bad { color: #fca5a5; } .res.warn { color: var(--warn); }
  .score { font-size: 56px; font-weight: 800; direction: ltr; text-align: right; } .score small { font-size: 22px; }
  .stars { color: var(--gold); font-size: 34px; } .stars .dim { color: #475569; opacity: 1; }
  .pct { font-size: 34px; margin-right: 10px; }

  /* أسئلة */
  .qhead { color: var(--warn); font-weight: 800; font-size: 18px; margin-bottom: 8px; }
  .q { font-size: 21px; line-height: 1.7; font-weight: 700; margin: 6px 0 14px; } .q.big { font-size: 24px; }
  .opts1 { display: flex; flex-direction: column; gap: 10px; }
  .opts1 .opt { text-align: start; font-size: 19px; padding: 13px 16px; line-height: 1.5; display: block; width: 100%; }
  .opts1 .opt b { display: inline-block; min-width: 26px; color: var(--acc); }
  .opt.sel { background: #0e4f72; border-color: var(--acc); }
  .opt.right { background: #14532d !important; border-color: var(--ok) !important; opacity: 1 !important; } .opt.wrong { background: #5b1414 !important; border-color: var(--bad) !important; opacity: 1 !important; }
  .opt.dim { opacity: .45; } .opt.rv { background: #182433; border: 1px solid var(--line); border-radius: 12px; padding: 12px 16px; font-size: 18px; }

  #touchUI .tb b { font: 800 calc(var(--tbs) * .38)/1 "Segoe UI", Arial, sans-serif; }

  #touchUI .tb.on { transform: scale(.9); background: rgba(56, 189, 248, .55); border-color: #7dd3fc; }

  @property --tp { syntax: '<number>'; inherits: false; initial-value: 0; }
